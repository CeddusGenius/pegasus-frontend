name: Build Windows Qt6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 6 and SDL2 via vcpkg
        shell: pwsh
        run: |
          vcpkg install qtbase:x64-windows qtdeclarative:x64-windows qtmultimedia:x64-windows qtshadertools:x64-windows qtsvg:x64-windows sdl2:x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build Pegasus
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Package Application
        shell: pwsh
        run: |
          mkdir dist
          mkdir dist\config
          mkdir dist\config\themes
          Copy-Item "build\src\app\Release\pegasus-fe.exe" -Destination "dist\"
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" -Destination "dist\"
          Copy-Item "LICENSE.md" -Destination "dist\"
          Copy-Item "README.md" -Destination "dist\"
          New-Item -Path "dist\portable.txt" -ItemType File
          & "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\tools\qt6\bin\windeployqt.exe" --qmldir src\frontend dist\pegasus-fe.exe

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: pegasus-fe-win64-qt6
          path: dist/

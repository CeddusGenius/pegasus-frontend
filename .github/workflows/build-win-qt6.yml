name: Build Windows Qt6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt 6.8.3
        id: install-qt
        uses: jurplel/install-qt-action@master
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia qtshadertools qtsvg'
          setup-python: 'false'

      - name: Download SDL2
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-devel-2.32.10-VC.zip" -OutFile "SDL2.zip"
          Expand-Archive -Path "SDL2.zip" -DestinationPath "C:\SDL2"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ steps.install-qt.outputs.qt-root-dir }};C:\SDL2\SDL2-2.32.10"

      - name: Build Pegasus
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Package Application
        shell: pwsh
        run: |
          mkdir dist
          mkdir dist\config
          mkdir dist\config\themes
          Copy-Item "build\src\app\Release\pegasus-fe.exe" -Destination "dist\"
          Copy-Item "C:\SDL2\SDL2-2.32.10\lib\x64\SDL2.dll" -Destination "dist\"
          Copy-Item "LICENSE.md" -Destination "dist\"
          Copy-Item "README.md" -Destination "dist\"
          New-Item -Path "dist\portable.txt" -ItemType File
          & "${{ steps.install-qt.outputs.qt-root-dir }}\bin\windeployqt.exe" --qmldir src\frontend dist\pegasus-fe.exe

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: pegasus-fe-win64-qt6
          path: dist/
